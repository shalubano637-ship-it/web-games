<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>NEON: The Last Light — Animated Short</title>
<style>
:root{color-scheme:dark;--cyan:#7cf7ff;--pink:#ff4d9d;--ink:#070914}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
body{min-height:100svh}.movie{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(ellipse at 50% 40%,#18213f 0,#090d1d 48%,#03040b 100%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(0deg,rgba(1,2,8,.92),transparent 34%,transparent 70%,rgba(2,3,12,.55)),radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.6) 100%)}
.top{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;padding:clamp(16px,4vw,34px);display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:3}
.brand{font-size:11px;letter-spacing:.34em;font-weight:800;color:var(--cyan)}.chapter{font-size:10px;letter-spacing:.2em;color:#c5cce3;text-transform:uppercase}
.titlecard{position:absolute;left:8%;right:8%;top:23%;text-align:center;transition:opacity .6s,transform .6s;z-index:2;text-shadow:0 5px 35px #000}
.kicker{font-size:clamp(9px,1.5vw,12px);letter-spacing:.45em;color:var(--cyan);text-transform:uppercase}
h1{font-size:clamp(36px,9vw,100px);line-height:.92;letter-spacing:-.06em;margin:15px 0 16px;font-weight:950;text-transform:uppercase}
h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.85);text-shadow:none}
.subtitle{max-width:520px;margin:auto;color:#c4cbe0;font-size:clamp(12px,2.1vw,16px);line-height:1.7}
.caption{position:absolute;left:8%;right:8%;bottom:23%;text-align:center;font-size:clamp(15px,3vw,26px);font-weight:650;letter-spacing:.015em;text-shadow:0 2px 16px #000;opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;z-index:2}
.caption.show{opacity:1;transform:translateY(0)}.caption small{display:block;font-size:10px;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
.controls{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:18px clamp(16px,4vw,34px) max(20px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(2,3,10,.95),rgba(2,3,10,.05));}
.progress{height:3px;background:#ffffff2b;margin-bottom:15px;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 14px var(--cyan)}
.row{display:flex;align-items:center;gap:12px}.btn{border:1px solid #ffffff35;color:white;background:#ffffff0c;border-radius:999px;min-height:42px;padding:0 17px;font-weight:700;font-size:12px;cursor:pointer;backdrop-filter:blur(10px)}.btn.primary{background:var(--cyan);color:#071019;border-color:var(--cyan)}.btn:focus-visible{outline:2px solid white;outline-offset:3px}.time{font-size:11px;color:#aab2ca;font-variant-numeric:tabular-nums}.hint{margin-left:auto;font-size:10px;letter-spacing:.12em;color:#8e96b0;text-transform:uppercase}
.flash{position:absolute;inset:0;background:white;opacity:0;z-index:5;pointer-events:none}.flash.hit{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@media(max-width:520px){.chapter{display:none}.titlecard{top:25%}.caption{bottom:25%}.hint{display:none}.btn{padding:0 13px}.controls{padding-bottom:max(24px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="movie" aria-label="NEON animated short film">
<canvas id="world" aria-label="Animated night city scene"></canvas><div class="vignette"></div>
<header class="top"><div class="brand">STUDIO / 07</div><div class="chapter" id="chapter">A CINEMATIC EXPERIMENT</div></header>
<section class="titlecard" id="titlecard"><div class="kicker">An original code-made short</div><h1>NEON <span>LAST LIGHT</span></h1><p class="subtitle">In a city that forgot the stars, one spark can change everything.</p></section>
<div class="caption" id="caption"><small id="caplabel">Chapter 01</small><span id="captext">The city held its breath.</span></div>
<div class="flash" id="flash"></div>
<footer class="controls"><div class="progress"><div class="bar" id="bar"></div></div><div class="row"><button class="btn primary" id="play">▶ Play film</button><button class="btn" id="restart">↺ Restart</button><span class="time" id="time">00:00 / 00:42</span><span class="hint">Sound-free · Original animation</span></div></footer>
</main>
<script>
(()=> {
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const title=document.getElementById('titlecard'),caption=document.getElementById('caption'),caplabel=document.getElementById('caplabel'),captext=document.getElementById('captext'),chapter=document.getElementById('chapter'),bar=document.getElementById('bar'),timeEl=document.getElementById('time'),playBtn=document.getElementById('play'),flash=document.getElementById('flash');
const duration=42;let playing=false,startAt=0,elapsed=0,raf=0,lastCaption=-1,W=0,H=0,dpr=1,stars=[],buildings=[],rain=[];
const scenes=[
{at:0,label:'PROLOGUE',text:'The city held its breath.',chapter:'A CITY WITHOUT DAWN'},
{at:7,label:'CHAPTER 01',text:'Then, a single light woke up.',chapter:'THE SPARK'},
{at:15,label:'CHAPTER 02',text:'Some shadows fear the light.',chapter:'SOMETHING STIRS'},
{at:23,label:'CHAPTER 03',text:'She did not step back.',chapter:'THE LAST LIGHT'},
{at:31,label:'CLIMAX',text:'One spark. A thousand stars.',chapter:'IGNITION'},
{at:38,label:'END',text:'The night was never empty.',chapter:'TO BE CONTINUED'}
];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(W*H/3600)},()=>({x:Math.random()*W,y:Math.random()*H*.68,r:Math.random()*1.5+.2,a:Math.random()*.7+.15,p:Math.random()*7}));buildings=[];let x=-5;while(x<W+30){let w=18+Math.random()*48,h=H*(.12+Math.random()*.32);buildings.push({x,w,h,seed:Math.random()});x+=w+3}rain=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*22,s:1+Math.random()*3}))}
function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function person(x,y,s,color,pose,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.shadowColor=color;ctx.shadowBlur=18;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';ctx.fillStyle='#090b18';ctx.beginPath();ctx.ellipse(0,-44,9,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-32);ctx.lineTo(0,-5);ctx.stroke();let swing=Math.sin(t*5)*8;ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(-13+swing*.2,-12);ctx.moveTo(0,-26);ctx.lineTo(12-swing*.3,-15);ctx.moveTo(0,-5);ctx.lineTo(-9-swing*.2,14);ctx.moveTo(0,-5);ctx.lineTo(10+swing*.2,14);ctx.stroke();ctx.restore()}
function draw(t){ctx.clearRect(0,0,W,H);let night=ctx.createLinearGradient(0,0,0,H);night.addColorStop(0,'#080b1c');night.addColorStop(.55,'#171a36');night.addColorStop(1,'#070812');ctx.fillStyle=night;ctx.fillRect(0,0,W,H);
const pulse=.5+.5*Math.sin(t*1.7);glow(W*.72,H*.22,Math.min(W,H)*.19,'rgba(88,111,255,.13)');ctx.fillStyle='#d8eaff';ctx.globalAlpha=.75;ctx.beginPath();ctx.arc(W*.72,H*.22,Math.min(W,H)*.045,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#151a34';ctx.beginPath();ctx.arc(W*.74,H*.2,Math.min(W,H)*.043,0,Math.PI*2);ctx.fill();
stars.forEach(s=>{ctx.globalAlpha=s.a*(.6+.4*Math.sin(t*2+s.p));ctx.fillStyle='#e4f7ff';ctx.fillRect(s.x,s.y,s.r,s.r)});ctx.globalAlpha=1;
buildings.forEach((b,i)=>{let y=H-b.h;ctx.fillStyle=i%3===0?'#0b1024':'#0a0d1b';ctx.fillRect(b.x,y,b.w,b.h);for(let wy=y+12;wy<H-10;wy+=13)for(let wx=b.x+5;wx<b.x+b.w-4;wx+=10){if(Math.sin(wx*wy+b.seed*80)>.35){ctx.fillStyle=(i%4===0)?'rgba(124,247,255,.5)':'rgba(255,77,157,.32)';ctx.fillRect(wx,wy,3,5)}}});
ctx.fillStyle='#080a13';ctx.fillRect(0,H*.83,W,H*.17);
const heroineX=W*(.5+.025*Math.sin(t*.8)),heroineY=H*.82;
if(t>5&&t<40){glow(heroineX,heroineY-H*.16,Math.min(W,H)*(.08+.025*pulse),'rgba(255,77,157,.22)');person(heroineX,heroineY,Math.max(.75,Math.min(1.35,H/650)),'#ff6bb3',0,t)}
if(t>14&&t<33){let x=W*(.5+.23*Math.sin((t-14)*.48));person(x,H*.82,Math.max(.8,Math.min(1.5,H/620)),'#7cf7ff',0,t)}
if(t>22&&t<34){ctx.save();ctx.strokeStyle='rgba(124,247,255,.9)';ctx.shadowColor='#7cf7ff';ctx.shadowBlur=20;ctx.lineWidth=2;let x=heroineX+20,y=H*.58;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(t*8)*12,y-H*.22);ctx.stroke();ctx.restore()}
if(t>30){let power=Math.min(1,(t-30)/4);glow(W*.5,H*.47,Math.min(W,H)*(.12+power*.48),'rgba(124,247,255,'+(.15+power*.2)+')');for(let i=0;i<24;i++){let a=i*Math.PI*2/24+t*.1,r=(20+((t*80+i*23)%Math.max(30,Math.min(W,H)*.4)))*power;ctx.fillStyle=i%2?'#7cf7ff':'#ff75bd';ctx.globalAlpha=.4+power*.6;ctx.beginPath();ctx.arc(W*.5+Math.cos(a)*r,H*.48+Math.sin(a)*r,1+power*2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
if(t>12&&t<38){ctx.strokeStyle='rgba(124,247,255,.16)';ctx.lineWidth=1;rain.forEach(r=>{r.y=(r.y+ r.s*2)%H;ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-3,r.y+r.l);ctx.stroke()})}
if(t>38){ctx.fillStyle='rgba(5,6,15,'+Math.min(.9,(t-38)*.22)+')';ctx.fillRect(0,0,W,H)}
}
function updateUI(t){let scene=0;for(let i=0;i<scenes.length;i++)if(t>=scenes[i].at)scene=i;if(scene!==lastCaption){lastCaption=scene;const s=scenes[scene];caplabel.textContent=s.label;captext.textContent=s.text;chapter.textContent=s.chapter;caption.classList.add('show');if(scene===0){title.style.opacity='1';title.style.transform='translateY(0)'}else{title.style.opacity='0';title.style.transform='translateY(-14px)'}if(scene===4){flash.classList.remove('hit');void flash.offsetWidth;flash.classList.add('hit')}}bar.style.width=(t/duration*100)+'%';timeEl.textContent=fmt(t)+' / 00:42';playBtn.textContent=playing?'Ⅱ Pause':(t>=duration?'↺ Play again':'▶ Play film')}
function fmt(n){return '00:'+String(Math.floor(n)).padStart(2,'0')}
function loop(now){if(!playing)return;elapsed=Math.min(duration,(now-startAt)/1000);draw(elapsed);updateUI(elapsed);if(elapsed>=duration){playing=false;updateUI(elapsed);return}raf=requestAnimationFrame(loop)}
function toggle(){if(playing){playing=false;cancelAnimationFrame(raf);elapsed=Math.min(duration,(performance.now()-startAt)/1000);draw(elapsed);updateUI(elapsed)}else{if(elapsed>=duration)elapsed=0;playing=true;startAt=performance.now()-elapsed*1000;updateUI(elapsed);raf=requestAnimationFrame(loop)}}
playBtn.addEventListener('click',toggle);document.getElementById('restart').addEventListener('click',()=>{playing=false;cancelAnimationFrame(raf);elapsed=0;lastCaption=-1;draw(0);updateUI(0);toggle()});addEventListener('resize',()=>{resize();draw(elapsed)});resize();draw(0);updateUI(0);
})();
</script>
</body>
</html>
