<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Coin Rush browser game">
  <title>Coin Rush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="top"><a href="../../">← Games</a><button id="restart" type="button">Restart</button></div>
  <div class="hud"><span>Coins <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
  <div id="arena" class="arena" aria-label="Coin Rush game area" tabindex="0">
    <div id="player" class="player"></div><div id="coin" class="coin"></div><div id="enemy" class="enemy"></div>
  </div>
  <div class="controls" aria-label="Movement controls">
    <button type="button" data-key="ArrowUp">↑</button>
    <button type="button" data-key="ArrowLeft">←</button>
    <button type="button" data-key="ArrowDown">↓</button>
    <button type="button" data-key="ArrowRight">→</button>
  </div>
  <p id="status" aria-live="polite">Collect the coin. Avoid the red block.</p>
</main>
<script src="game.js"></script>
</body>
</html>
