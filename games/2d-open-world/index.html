 if(typeof Peer==="undefined"){start.classList.add("hide");return}
 roomCode=room.toUpperCase();myId="guest-"+Math.random().toString(36).slice(2);
 try{peer=new Peer(myId,{debug:0})}catch(e){start.classList.add("hide");return}
 peer.on("open",()=>{
   conn=peer.connect("host-"+roomCode,{reliable:true});
   conn.on("open",()=>{start.classList.add("hide");initAudio();roomEl.textContent="Online • "+roomCode;});
   conn.on("data",d=>{
     if(d.type==="full"){history.replaceState(null,"",location.pathname);roomEl.textContent="Solo";statusEl.textContent="Room full.";return}
     if(d.type==="state"){
       for(const id in d.players){if(id===myId)continue;let p=remote.get(id);if(!p){p={...d.players[id],mesh:makePlayer(0x9333ea)};remote.set(id,p)}else Object.assign(p,d.players[id])}
       for(const [id,p] of remote)if(!d.players[id]){scene.remove(p.mesh);remote.delete(id)}
       roomEl.textContent="Online • "+roomCode+" • "+Object.keys(d.players).length+"/6";
     }
   });
   conn.on("close",()=>{roomEl.textContent="Solo";statusEl.textContent="Host disconnected."});
 });
 peer.on("error",e=>{console.warn("PeerJS:",e);roomEl.textContent="Solo";start.classList.add("hide")});
}

if(sharedRoom&&/^[A-Z0-9]{6}$/i.test(sharedRoom)){statusEl.textContent="Joining multiplayer...";setupJoin(sharedRoom)}else{}

function drawMinimap(){const w=mm.width,h=mm.height,sx=w/world.w,sz=h/world.h;mctx.clearRect(0,0,w,h);mctx.fillStyle="#26382f";mctx.fillRect(0,0,w,h);mctx.fillStyle="#414746";mctx.fillRect(0,(world.h/2-14)*sz,w,28*sz);mctx.fillRect((world.w/2-14)*sx,0,28*sx,h);for(const q of houses){mctx.fillStyle="#665c4f";mctx.fillRect((q.x+world.w/2)*sx-8,(q.z+world.h/2)*sz-6,16,12)}for(const t of trees){mctx.fillStyle="#38533d";mctx.beginPath();mctx.arc((t.x+world.w/2)*sx,(t.z+world.h/2)*sz,3,0,7);mctx.fill()}for(const g of guns)if(!g.userData.taken){mctx.fillStyle="#facc15";mctx.beginPath();mctx.arc((g.position.x+world.w/2)*sx,(g.position.z+world.h/2)*sz,4,0,7);mctx.fill()}for(const [id,p] of remote){mctx.fillStyle="#a855f7";mctx.beginPath();mctx.arc((p.x+world.w/2)*sx,(p.z+world.h/2)*sz,6,0,7);mctx.fill()}for(const z of zombies)if(!z.dead){mctx.fillStyle="#ef4444";mctx.beginPath();mctx.arc((z.x+world.w/2)*sx,(z.z+world.h/2)*sz,5,0,7);mctx.fill()}mctx.fillStyle="#38bdf8";mctx.beginPath();mctx.arc((player.x+world.w/2)*sx,(player.z+world.h/2)*sz,7,0,7);mctx.fill()}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);localMove(dt);if(isHost)hostZombies(dt);for(const [id,p] of remote){if(p.mesh){p.mesh.position.lerp(new THREE.Vector3(p.x,0,p.z),.35);p.mesh.rotation.y=p.rot||0}}const target=new THREE.Vector3(player.x,2.2,player.z);const dist=17;const horiz=Math.cos(cameraPitch)*dist;const desired=new THREE.Vector3(player.x+Math.sin(cameraYaw)*horiz,7+Math.sin(cameraPitch)*dist,player.z+Math.cos(cameraYaw)*horiz);camera.position.lerp(desired,.12);camera.lookAt(target);hpEl.style.width=player.hp+"%";sendState();drawMinimap();renderer.render(scene,camera)}loop();
