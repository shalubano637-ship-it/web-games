<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>2D Open World</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{display:block;width:100%;height:100%;image-rendering:auto}
#start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#07111f}#play{border:0;border-radius:16px;padding:16px 38px;font:800 22px system-ui;color:#fff;background:#2563eb;box-shadow:0 8px 30px #0006}#start.hide{display:none}.touch{position:fixed;z-index:10;bottom:18px;left:18px;width:105px;height:105px;border-radius:50%;background:#0f1b2dcc;border:2px solid #64748b99;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#64748bcc;border:2px solid #cbd5e1;box-shadow:0 4px 18px #0006;touch-action:none}#hit{position:fixed;z-index:10;right:24px;bottom:26px;width:82px;height:82px;border-radius:50%;border:2px solid #fca5a5;background:#991b1bcc;color:#fff;font-size:34px;font-weight:800;box-shadow:0 5px 18px #0007;touch-action:none;user-select:none}#hit:active{transform:scale(.92);background:#dc2626}
#hpbar{position:fixed;z-index:11;top:16px;left:16px;width:150px;height:14px;border:2px solid #111827;border-radius:10px;background:#111827aa;overflow:hidden}#hpfill{height:100%;width:100%;background:#22c55e;transition:width .15s ease}#minimap{position:fixed;z-index:11;top:16px;right:16px;width:150px;height:105px;border:2px solid #334155;border-radius:10px;background:#16351f;box-shadow:0 4px 14px #0007;image-rendering:auto}#hit{position:fixed;z-index:10;right:24px;bottom:26px;width:82px;height:82px;border-radius:50%;border:2px solid #fca5a5;background:#991b1bcc;color:#fff;font-size:34px;font-weight:800;box-shadow:0 5px 18px #0007;touch-action:none;user-select:none}#hit:active{transform:scale(.92);background:#dc2626}
@media (pointer:fine) and (min-width:800px){.touch{display:none}}
</style></head><body>
<div id="start"><button id="play">PLAY</button></div><canvas id="game"></canvas>
<div id="hpbar"><div id="hpfill"></div></div><canvas id="minimap" width="150" height="105" aria-label="Mini map"></canvas><div class="touch" id="joystick" aria-label="Movement joystick"><div class="stick" id="stick"></div></div><button id="hit" aria-label="Attack">⚔</button>
<script>
(()=>{const c=document.getElementById("game"),ctx=c.getContext("2d"),start=document.getElementById("start"),play=document.getElementById("play"),hitBtn=document.getElementById("hit"),mm=document.getElementById("minimap"),mctx=mm.getContext("2d"),hpfill=document.getElementById("hpfill");let W,H,dpr,keys={},touch={},coins=0,attackUntil=0,lastDir={x:1,y:0},kills=0,waveSize=3,aliveTarget=3;
async function landscape(){try{if(document.fullscreenElement!==document.documentElement&&document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:"hide"})}}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape")}catch(e){}}
function checkOrientation(){if(innerHeight>innerWidth)landscape()}
addEventListener("resize",checkOrientation);addEventListener("orientationchange",checkOrientation);play.addEventListener("click",async()=>{await landscape();start.classList.add("hide")});start.addEventListener("pointerdown",async e=>{if(e.target===start){await landscape();start.classList.add("hide")}});checkOrientation();
const world={w:3200,h:2200},player={x:1600,y:1100,r:18,s:4.2,hp:100},cam={x:0,y:0},trees=[],rocks=[],coinsList=[],houses=[],zombies=[];
function rand(a,b){return a+Math.random()*(b-a)}
function add(){for(let i=0;i<120;i++){let x=rand(80,world.w-80),y=rand(80,world.h-80);if(Math.hypot(x-player.x,y-player.y)<280)continue;trees.push({x,y,s:rand(.8,1.25)})}for(let i=0;i<35;i++)rocks.push({x:rand(70,world.w-70),y:rand(70,world.h-70),s:rand(.7,1.5)});for(let i=0;i<22;i++)coinsList.push({x:rand(100,world.w-100),y:rand(100,world.h-100),got:false});for(let i=0;i<9;i++)houses.push({x:1200+(i%3)*390,y:700+Math.floor(i/3)*350,w:150,h:110})}add();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function key(e,v){const k=e.key.toLowerCase();if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();keys[k]=v}addEventListener("keydown",e=>key(e,true));addEventListener("keyup",e=>key(e,false));
const joy=document.getElementById("joystick"),stick=document.getElementById("stick");let joyId=null;
function joyMove(e){if(joyId!==null&&e.pointerId!==joyId)return;const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.31;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}stick.style.transform="translate("+dx+"px,"+dy+"px)";touch.left=dx<-max*.2;touch.right=dx>max*.2;touch.up=dy<-max*.2;touch.down=dy>max*.2}
function joyEnd(e){if(joyId!==null&&e.pointerId!==joyId)return;joyId=null;touch={};stick.style.transform="translate(0,0)"}
joy.addEventListener("pointerdown",e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",e=>{e.preventDefault();joyMove(e)});["pointerup","pointercancel"].forEach(ev=>joy.addEventListener(ev,joyEnd));
function spawnZombie(){let a=Math.random()*Math.PI*2,d=520+Math.random()*600,x=player.x+Math.cos(a)*d,y=player.y+Math.sin(a)*d;x=Math.max(70,Math.min(world.w-70,x));y=Math.max(70,Math.min(world.h-70,y));zombies.push({x,y,r:18,s:1.05+Math.random()*.35,hp:2,hit:0})}
function spawnWaveZombies(){while(zombies.length<waveSize)spawnZombie()}
function attack(){const now=performance.now();if(now<attackUntil)return;attackUntil=now+360;for(const z of zombies){const dx=z.x-player.x,dy=z.y-player.y,d=Math.hypot(dx,dy)||1;const dot=(dx*lastDir.x+dy*lastDir.y)/d;if(d<82&&dot>.15){z.hp--;z.hit=now+100;if(z.hp<=0){z.dead=now+180;kills++}}}}
hitBtn.addEventListener("pointerdown",e=>{e.preventDefault();attack()});addEventListener("keydown",e=>{if(e.code==="Space"||e.key.toLowerCase()==="j"){e.preventDefault();attack()}});
spawnWaveZombies();let nextSpawn=performance.now()+1500;
function move(){let dx=(keys.d||keys.arrowright||touch.right?1:0)-(keys.a||keys.arrowleft||touch.left?1:0),dy=(keys.s||keys.arrowdown||touch.down?1:0)-(keys.w||keys.arrowup||touch.up?1:0);if(dx&&dy){dx*=.707;dy*=.707}if(dx||dy){lastDir={x:dx,y:dy};const m=Math.hypot(lastDir.x,lastDir.y);lastDir.x/=m;lastDir.y/=m}player.x=Math.max(35,Math.min(world.w-35,player.x+dx*player.s));player.y=Math.max(35,Math.min(world.h-35,player.y+dy*player.s));for(const q of coinsList)if(!q.got&&Math.hypot(player.x-q.x,player.y-q.y)<34){q.got=true;coins++;}const now=performance.now();for(const z of zombies){if(z.dead)continue;const dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.s;z.y+=dy/d*z.s;if(d<34&&now-z.hit>650){player.hp=Math.max(0,player.hp-8);z.hit=now;if(player.hp===0){player.x=rand(120,world.w-120);player.y=rand(120,world.h-120);player.hp=100;}}}for(let i=zombies.length-1;i>=0;i--)if(zombies[i].dead&&now>zombies[i].dead)zombies.splice(i,1);if(zombies.length===0&&kills>0){spawnWave=Math.min(64,Math.max(3,waveSize*2));spawnWaveZombies();nextSpawn=now+1200}if(now>nextSpawn&&zombies.length<waveSize){spawnWaveZombies();nextSpawn=now+1800+Math.random()*2500}hpfill.style.width=player.hp+"%"}
function drawMinimap(){const mw=mm.width,mh=mm.height,sx=mw/world.w,sy=mh/world.h;mctx.clearRect(0,0,mw,mh);mctx.fillStyle="#315f36";mctx.fillRect(0,0,mw,mh);mctx.fillStyle="#b99a67";mctx.fillRect(0,1010*sy,mw,170*sy);mctx.fillRect(1515*sx,0,170*sx,mh);for(const z of zombies){if(z.dead)continue;mctx.fillStyle="#ef4444";mctx.beginPath();mctx.arc(z.x*sx,z.y*sy,3,0,Math.PI*2);mctx.fill()}mctx.fillStyle="#38bdf8";mctx.beginPath();mctx.arc(player.x*sx,player.y*sy,4,0,Math.PI*2);mctx.fill()} 
function draw(){cam.x=Math.max(0,Math.min(world.w-W,player.x-W/2));cam.y=Math.max(0,Math.min(world.h-H,player.y-H/2));ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle="#75a85b";ctx.fillRect(0,0,world.w,world.h);ctx.fillStyle="#6b9b54";for(let x=0;x<world.w;x+=90)for(let y=0;y<world.h;y+=90)ctx.fillRect(x+8,y+8,2,2);ctx.fillStyle="#b99a67";ctx.fillRect(0,1010,world.w,170);ctx.fillRect(1515,0,170,world.h);ctx.fillStyle="#c7ab78";ctx.fillRect(0,1060,world.w,70);ctx.fillRect(1565,0,70,world.h);
for(const h of houses){ctx.fillStyle="#e9d5b5";ctx.fillRect(h.x,h.y,h.w,h.h);ctx.fillStyle="#9f4f3c";ctx.beginPath();ctx.moveTo(h.x-15,h.y);ctx.lineTo(h.x+h.w/2,h.y-65);ctx.lineTo(h.x+h.w+15,h.y);ctx.fill();ctx.fillStyle="#684735";ctx.fillRect(h.x+h.w/2-15,h.y+55,30,55)}
for(const r of rocks){ctx.fillStyle="#697386";ctx.beginPath();ctx.ellipse(r.x,r.y,18*r.s,13*r.s,0,0,Math.PI*2);ctx.fill()}
for(const tr of trees){ctx.fillStyle="#6b442e";ctx.fillRect(tr.x-7,tr.y+8,14,34*tr.s);ctx.fillStyle="#245c3b";ctx.beginPath();ctx.arc(tr.x,tr.y,28*tr.s,0,Math.PI*2);ctx.fill();ctx.fillStyle="#2f7549";ctx.beginPath();ctx.arc(tr.x-15*tr.s,tr.y+5,19*tr.s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(tr.x+15*tr.s,tr.y+7,19*tr.s,0,Math.PI*2);ctx.fill()}
for(const q of coinsList)if(!q.got){ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(q.x,q.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff1a8";ctx.lineWidth=3;ctx.stroke()}
for(const z of zombies){if(z.dead&&performance.now()>z.dead)continue;ctx.fillStyle=z.hit>performance.now()?"#fff":"#7f1d1d";ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#166534";ctx.beginPath();ctx.arc(z.x,z.y-10,13,Math.PI,0);ctx.fill();ctx.fillStyle="#fef2f2";ctx.beginPath();ctx.arc(z.x-6,z.y-2,3,0,Math.PI*2);ctx.arc(z.x+6,z.y-2,3,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111827";ctx.fillRect(z.x-7,z.y+7,14,3);ctx.fillStyle="#ef4444";ctx.fillRect(z.x-18,z.y-30,36,4);ctx.fillStyle="#22c55e";ctx.fillRect(z.x-18,z.y-30,18*z.hp,4)}
ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle="#2563eb";ctx.beginPath();ctx.arc(0,-11,12,0,Math.PI*2);ctx.fill();ctx.fillStyle="#1d4ed8";ctx.fillRect(-11,0,22,25);ctx.fillStyle="#f5cfa0";ctx.beginPath();ctx.arc(0,-12,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d1d5db";ctx.lineWidth=6;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(8,5);ctx.lineTo(lastDir.x*30+8,lastDir.y*30+5);ctx.stroke();ctx.strokeStyle="#7c4a21";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(8,5);ctx.lineTo(lastDir.x*18+8,lastDir.y*18+5);ctx.stroke();if(performance.now()<attackUntil){ctx.strokeStyle="#f8fafc";ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,58,Math.atan2(lastDir.y,lastDir.x)-.9,Math.atan2(lastDir.y,lastDir.x)+.9);ctx.stroke()}ctx.restore();
ctx.restore()}
function loop(){move();draw();requestAnimationFrame(loop)}loop()})();</script></body></html>
