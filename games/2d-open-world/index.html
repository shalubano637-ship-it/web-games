<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D Open World Multiplayer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none}#game{position:fixed;inset:0}#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#07111bee,#0b1d2bee)}#start.hide{display:none}#lobby{width:min(370px,88vw);padding:24px;border:1px solid #ffffff30;border-radius:22px;background:#0b1728ee;box-shadow:0 18px 60px #0009;text-align:center;backdrop-filter:blur(12px)}#lobby h1{margin:0 0 6px;font-size:28px}#lobby p{margin:0 0 18px;color:#94a3b8;font-size:13px}.input{box-sizing:border-box;width:100%;height:46px;margin-bottom:10px;padding:0 13px;border:1px solid #ffffff2e;border-radius:12px;background:#111f33;color:#fff;outline:none;font:600 15px system-ui}.btn{height:46px;border:0;border-radius:12px;padding:0 16px;background:#2563eb;color:#fff;font:800 14px system-ui}.full{width:100%;margin-bottom:10px}.join{display:flex;gap:8px}.join .input{margin:0}.join .btn{width:92px}.status{min-height:20px;margin-top:13px;color:#cbd5e1;font-size:12px}.hud{position:fixed;z-index:10;pointer-events:none}.top{top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start}.pill{padding:8px 11px;border:1px solid #ffffff30;border-radius:12px;background:#07111dcc;box-shadow:0 6px 20px #0007;font-weight:800;font-size:12px}.hp{width:170px;height:15px;padding:2px;margin-top:7px;border-radius:99px;background:#07111dcc;border:1px solid #ffffff44;overflow:hidden}.hp i{display:block;width:100%;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#4ade80)}#minimap{width:210px;height:140px;border:2px solid #ffffff88;border-radius:14px;background:#17351f;box-shadow:0 7px 24px #0009}.bottom{left:18px;right:18px;bottom:18px;display:flex;justify-content:space-between;align-items:end}.joy{pointer-events:auto;width:105px;height:105px;border-radius:50%;background:#0f1b2ddd;border:1px solid #ffffff55;box-shadow:0 7px 22px #0008;position:relative}.stick{position:absolute;width:44px;height:44px;left:50%;top:50%;margin:-22px;border-radius:50%;background:linear-gradient(145deg,#94a3b8,#475569);border:1px solid #fff;box-shadow:0 4px 12px #0007}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.action{width:74px;height:74px;border-radius:50%;border:1px solid #ffffff66;color:#fff;font-size:29px;font-weight:900;box-shadow:0 7px 22px #0008}.attack{background:linear-gradient(145deg,#dc2626,#7f1d1d)}.fire{background:linear-gradient(145deg,#475569,#1e293b)}.weapon{position:absolute;right:0;bottom:82px;padding:7px 10px;border-radius:10px;background:#07111dcc;border:1px solid #ffffff44;font-size:12px;font-weight:800}.cross{position:fixed;left:50%;top:50%;z-index:8;transform:translate(-50%,-50%);font-size:22px;color:#fff9;text-shadow:0 2px 5px #000;pointer-events:none}.hint{position:fixed;z-index:9;left:50%;top:70px;transform:translateX(-50%);padding:6px 10px;border-radius:9px;background:#07111daa;font-size:11px;color:#cbd5e1}.hidden{display:none}@media(pointer:fine) and (min-width:800px){.joy,.actions{display:none}}@media(max-width:700px){#minimap{width:170px;height:114px}.top{top:8px;left:8px;right:8px}.bottom{left:12px;right:12px;bottom:12px}}
</style></head><body>
<div id="start"><div id="lobby"><h1>3D Open World</h1><p>6-player online survival • Green Valley</p><input id="name" class="input" maxlength="14" value="Player" placeholder="Your name"><button id="create" class="btn full">CREATE ROOM</button><div class="join"><input id="code" class="input" maxlength="6" placeholder="ROOM CODE"><button id="join" class="btn">JOIN</button></div><div id="status" class="status">Create a room or join one. Max 6 players.</div></div></div>
<canvas id="game"></canvas><div class="cross">+</div><div id="hint" class="hint">WASD / arrows • mouse to aim • F to fire • Space to attack</div>
<div class="hud top"><div><div class="pill" id="room">Solo</div><div class="hp"><i id="hp"></i></div></div><canvas id="minimap" width="420" height="280"></canvas></div>
<div class="hud bottom"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="action fire" id="fire">●</button><button class="action attack" id="attack">⚔</button><div class="weapon" id="weapon">Fists</div></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const canvas=document.getElementById("game"),start=document.getElementById("start"),nameEl=document.getElementById("name"),codeEl=document.getElementById("code"),createBtn=document.getElementById("create"),joinBtn=document.getElementById("join"),statusEl=document.getElementById("status"),roomEl=document.getElementById("room"),hpEl=document.getElementById("hp"),weaponEl=document.getElementById("weapon"),hint=document.getElementById("hint"),mm=document.getElementById("minimap"),mctx=mm.getContext("2d"),joy=document.getElementById("joy"),stick=document.getElementById("stick");
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b8dc);scene.fog=new THREE.Fog(0x87b8dc,70,430);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,700);camera.position.set(0,8,14);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight(0xdff4ff,0x35502d,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(80,130,60);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const world={w:320,h:220},player={x:0,z:0,y:0,hp:100,dir:new THREE.Vector3(0,0,-1)},remote=new Map(),zombies=[],guns=[],trees=[],houses=[];let weapon={name:"Fists",damage:0,ammo:0,maxAmmo:0,color:0xcbd5e1},kills=0,wave=3,lastFire=0,lastAttack=0,audio=null,peer=null,conn=null,isHost=false,myId="",roomCode="",netClock=0;
const gunTypes=[{name:"Pistol",damage:1,ammo:12,color:0x94a3b8,rate:300,range:38},{name:"SMG",damage:1,ammo:28,color:0x64748b,rate:120,range:46},{name:"Shotgun",damage:2,ammo:8,color:0xb45309,rate:520,range:20},{name:"Rifle",damage:3,ammo:10,color:0x334155,rate:380,range:65}];
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.82})}function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=m.receiveShadow=true;return m}
const ground=box(world.w,.5,world.h,0x6fa451);ground.position.y=-.25;scene.add(ground);
function addRoad(x,z,w,d){const r=box(w,.03,d,0xb99a67);r.position.set(x,.02,z);scene.add(r);const line=box(w,.035,1.2,0xe5d29e);line.position.set(x,.045,z);scene.add(line)}
addRoad(0,0,world.w,28);addRoad(0,0,28,world.h);
for(let i=0;i<18;i++){const x=(Math.random()-.5)*280,z=(Math.random()-.5)*180;if(Math.abs(x)<22||Math.abs(z)<22)continue;const h=6+Math.random()*5,b=box(14,h,12,0xe7d4b5);b.position.set(x,h/2,z);scene.add(b);const roof=box(16,1.2,14,0x9e4d3d);roof.position.set(x,h+.3,z);roof.rotation.y=.785;scene.add(roof);houses.push({x,z})}
function tree(x,z){const g=new THREE.Group();const trunk=box(1.5,6,1.5,0x70452e);trunk.position.y=3;g.add(trunk);const a=new THREE.Mesh(new THREE.SphereGeometry(4.5,12,10),mat(0x27633e));a.position.y=7;g.add(a);const b=a.clone();b.position.set(-2,6.5,1);b.scale.setScalar(.8);g.add(b);g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);trees.push({x,z})}
for(let i=0;i<100;i++){const x=(Math.random()-.5)*300,z=(Math.random()-.5)*200;if(Math.abs(x)<30||Math.abs(z)<30)continue;tree(x,z)}
function makePlayer(color=0x2563eb){const g=new THREE.Group();const body=box(2.3,3,1.5,color);body.position.y=2.1;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(1.05,16,12),mat(0xf5cfa0));head.position.y=4.3;g.add(head);const gun=box(.35,.35,3.3,0x111827);gun.position.set(.9,2.8,-1.8);gun.rotation.x=Math.PI/2;g.add(gun);g.userData.gun=gun;scene.add(g);return g}
const me=makePlayer();me.position.set(0,0,0);
function makeZombie(){const g=makePlayer(0x7f1d1d);g.scale.setScalar(.85);const eye=mat(0xfef2f2);for(const x of [-.35,.35]){const e=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),eye);e.position.set(x,4.45,-.9);g.add(e)}scene.add(g);return g}
function spawnZombie(){const a=Math.random()*Math.PI*2,d=35+Math.random()*55,z={x:player.x+Math.cos(a)*d,z:player.z+Math.sin(a)*d,hp:2,s:1.8+Math.random()*1.1,mesh:makeZombie()};z.x=Math.max(-145,Math.min(145,z.x));z.z=Math.max(-95,Math.min(95,z.z));z.mesh.position.set(z.x,0,z.z);zombies.push(z)}
function spawnWave(){while(zombies.length<wave)spawnZombie()}spawnWave();
for(let i=0;i<8;i++){const t=gunTypes[i%gunTypes.length],x=(Math.random()-.5)*260,z=(Math.random()-.5)*170,g=box(3,.5,1,t.color);g.position.set(x,.5,z);g.rotation.y=Math.random()*6.28;g.userData.type=t;g.userData.taken=false;scene.add(g);guns.push(g)}
function initAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}
function tone(f,d,type="sine",v=.04){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function soundGun(n){if(n==="Pistol")tone(520,.09,"square",.08);else if(n==="SMG")tone(190,.06,"sawtooth",.06);else if(n==="Shotgun"){tone(80,.2,"sawtooth",.12);tone(240,.08,"square",.04)}else tone(280,.1,"square",.07)}
function soundStep(){tone(85,.045,"triangle",.025)}function soundZombie(){tone(115,.3,"sawtooth",.025)}
function pickup(){for(const g of guns)if(!g.userData.taken&&Math.hypot(player.x-g.position.x,player.z-g.position.z)<3){g.userData.taken=true;g.visible=false;weapon={...g.userData.type,maxAmmo:g.userData.type.ammo};weaponEl.textContent=weapon.name+" • "+weapon.ammo+"/"+weapon.maxAmmo}}
function fire(){const now=performance.now();if(now-lastFire<weapon.rate||weapon.ammo<=0)return;lastFire=now;weapon.ammo--;weaponEl.textContent=weapon.name+" • "+weapon.ammo+"/"+weapon.maxAmmo;soundGun(weapon.name);for(const z of zombies){const dx=z.x-player.x,dz=z.z-player.z,d=Math.hypot(dx,dz)||1,dot=(dx*player.dir.x+dz*player.dir.z)/d;if(d<weapon.range&&dot>.35){z.hp-=weapon.damage;if(z.hp<=0){scene.remove(z.mesh);z.dead=true;kills++}}}if(!isHost&&conn?.open)conn.send({type:"fire",x:player.x,z:player.z,dir:{x:player.dir.x,z:player.dir.z},weapon:weapon.name});}
function attack(){const now=performance.now();if(now-lastAttack<450)return;lastAttack=now;for(const z of zombies){const dx=z.x-player.x,dz=z.z-player.z,d=Math.hypot(dx,dz)||1,dot=(dx*player.dir.x+dz*player.dir.z)/d;if(d<4.5&&dot>.1){z.hp--;if(z.hp<=0){scene.remove(z.mesh);z.dead=true;kills++}}}}
let joyId=null,touch={x:0,z:0};
function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.32;let x=e.clientX-cx,z=e.clientY-cy,d=Math.hypot(x,z);if(d>max){x=x/d*max;z=z/d*max}stick.style.transform="translate("+x+"px,"+z+"px)";touch={x:x/max,z:z/max}}
joy.addEventListener("pointerdown",e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener("pointermove",e=>{if(e.pointerId===joyId)joyMove(e)});["pointerup","pointercancel"].forEach(k=>joy.addEventListener(k,()=>{joyId=null;touch={x:0,z:0};stick.style.transform="translate(0,0)"}));
let keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")attack();if(e.key.toLowerCase()==="f"||e.code==="Enter")fire()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);document.getElementById("fire").onpointerdown=e=>{e.preventDefault();fire()};document.getElementById("attack").onpointerdown=e=>{e.preventDefault();attack()};
let dragging=false,lastX=0;addEventListener("pointerdown",e=>{if(e.clientX>innerWidth*.35&&e.clientY<innerHeight*.7){dragging=true;lastX=e.clientX}});addEventListener("pointermove",e=>{if(dragging){const dx=e.clientX-lastX;lastX=e.clientX;me.rotation.y-=dx*.008;player.dir.set(-Math.sin(me.rotation.y),0,-Math.cos(me.rotation.y))}});addEventListener("pointerup",()=>dragging=false);
function localMove(dt){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touch.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touch.z;if(x||z){const l=Math.hypot(x,z)||1;x/=l;z/=l;const speed=9;player.x+=x*speed*dt;player.z+=z*speed*dt;player.x=Math.max(-150,Math.min(150,player.x));player.z=Math.max(-100,Math.min(100,player.z));if(!dragging){me.rotation.y=Math.atan2(-x,-z);player.dir.set(x,0,z)}if(performance.now()%310<18)soundStep()}me.position.set(player.x,0,player.z);pickup()}
function hostZombies(dt){for(const z of zombies){if(z.dead)continue;const dx=player.x-z.x,dz=player.z-z.z,d=Math.hypot(dx,dz)||1;z.x+=dx/d*z.s*dt;z.z+=dz/d*z.s*dt;z.mesh.position.set(z.x,0,z.z);z.mesh.rotation.y=Math.atan2(dx,dz);if(d<2.4&&performance.now()%800<20)player.hp=Math.max(0,player.hp-8)}if(zombies.filter(z=>!z.dead).length===0){wave=Math.min(48,wave*2);spawnWave()}if(zombies.some(z=>!z.dead&&Math.hypot(z.x-player.x,z.z-player.z)<22)&&performance.now()%1800<20)soundZombie()}
function sendState(){const now=performance.now();if(now-netClock<70)return;netClock=now;const state={type:"state",players:{[myId]:{x:player.x,z:player.z,hp:player.hp,name:(nameEl.value||"Player").slice(0,14),rot:me.rotation.y}},zombies:zombies.filter(z=>!z.dead).map(z=>({x:z.x,z:z.z,hp:z.hp}))};if(isHost){for(const c of peerConns)c.open&&c.send(state)}else if(conn?.open)conn.send({type:"move",x:player.x,z:player.z,hp:player.hp,rot:me.rotation.y,name:(nameEl.value||"Player").slice(0,14)})}
let peerConns=[];function code(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return Array.from({length:6},()=>a[Math.floor(Math.random()*a.length)]).join("")}
function setupHost(){roomCode=code();myId="host-"+roomCode;isHost=true;peer=new Peer(myId);peer.on("open",()=>{roomEl.textContent="Room "+roomCode+" • 1/6";codeEl.value=roomCode;statusEl.textContent="Share this room code. Max 6 players.";start.classList.add("hide");initAudio()});peer.on("connection",c=>{if(peerConns.length>=5){c.send({type:"full"});c.close();return}peerConns.push(c);c.on("data",d=>{if(d.type==="move"){remote.set(c.peer,d);broadcast()}});c.on("close",()=>{remote.delete(c.peer);peerConns=peerConns.filter(x=>x!==c);broadcast()});broadcast()})}
function broadcast(){const ps={};for(const [id,p] of remote)ps[id]=p;ps[myId]={x:player.x,z:player.z,hp:player.hp,name:(nameEl.value||"Player").slice(0,14),rot:me.rotation.y};const st={type:"state",players:ps};for(const c of peerConns)if(c.open)c.send(st);roomEl.textContent="Room "+roomCode+" • "+(peerConns.length+1)+"/6"}
function setupJoin(){roomCode=codeEl.value.trim().toUpperCase();if(roomCode.length!==6){statusEl.textContent="Enter a 6-character room code.";return}myId="guest-"+Math.random().toString(36).slice(2);peer=new Peer(myId);peer.on("open",()=>{conn=peer.connect("host-"+roomCode,{reliable:true});conn.on("open",()=>{start.classList.add("hide");initAudio();roomEl.textContent="Room "+roomCode;});conn.on("data",d=>{if(d.type==="full"){statusEl.textContent="Room full (6/6).";return}if(d.type==="state"){for(const id in d.players){if(id===myId)continue;let p=remote.get(id);if(!p){p={...d.players[id],mesh:makePlayer(0x9333ea)};remote.set(id,p)}else Object.assign(p,d.players[id])}for(const [id,p] of remote){if(!d.players[id]){scene.remove(p.mesh);remote.delete(id)}}}});conn.on("close",()=>statusEl.textContent="Host disconnected.")});peer.on("error",()=>statusEl.textContent="Could not join room.")}
createBtn.onclick=setupHost;joinBtn.onclick=setupJoin;codeEl.oninput=()=>codeEl.value=codeEl.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
function drawMinimap(){const w=mm.width,h=mm.height,sx=w/world.w,sz=h/world.h;mctx.clearRect(0,0,w,h);mctx.fillStyle="#4d8a4d";mctx.fillRect(0,0,w,h);mctx.fillStyle="#b99a67";mctx.fillRect(0,(world.h/2-14)*sz,w,28*sz);mctx.fillRect((world.w/2-14)*sx,0,28*sx,h);for(const q of houses){mctx.fillStyle="#e8d1af";mctx.fillRect((q.x+world.w/2)*sx-8,(q.z+world.h/2)*sz-6,16,12)}for(const t of trees){mctx.fillStyle="#25603b";mctx.beginPath();mctx.arc((t.x+world.w/2)*sx,(t.z+world.h/2)*sz,3,0,7);mctx.fill()}for(const g of guns)if(!g.userData.taken){mctx.fillStyle="#facc15";mctx.beginPath();mctx.arc((g.position.x+world.w/2)*sx,(g.position.z+world.h/2)*sz,4,0,7);mctx.fill()}for(const [id,p] of remote){mctx.fillStyle="#a855f7";mctx.beginPath();mctx.arc((p.x+world.w/2)*sx,(p.z+world.h/2)*sz,6,0,7);mctx.fill()}for(const z of zombies)if(!z.dead){mctx.fillStyle="#ef4444";mctx.beginPath();mctx.arc((z.x+world.w/2)*sx,(z.z+world.h/2)*sz,5,0,7);mctx.fill()}mctx.fillStyle="#38bdf8";mctx.beginPath();mctx.arc((player.x+world.w/2)*sx,(player.z+world.h/2)*sz,7,0,7);mctx.fill()}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);localMove(dt);if(isHost)hostZombies(dt);for(const [id,p] of remote){if(p.mesh){p.mesh.position.lerp(new THREE.Vector3(p.x,0,p.z),.35);p.mesh.rotation.y=p.rot||0}}const target=new THREE.Vector3(player.x,4,player.z);const desired=new THREE.Vector3(player.x+Math.sin(me.rotation.y)*13,8.5,player.z+Math.cos(me.rotation.y)*13);camera.position.lerp(desired,.1);camera.lookAt(target);hpEl.style.width=player.hp+"%";sendState();drawMinimap();renderer.render(scene,camera)}loop();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);hint.classList.add("hidden")});
</script></body></html>
