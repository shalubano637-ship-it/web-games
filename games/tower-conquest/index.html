<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Tower Conquest</title><style>*{box-sizing:border-box}body{margin:0;background:#17202b;color:#fff;font-family:Arial;overflow:hidden}.hud{height:62px;background:#202d3b;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:900}.hud span{background:#111b26;padding:9px 12px;border-radius:12px}.game{position:relative;width:100vw;height:calc(100vh - 62px);background:radial-gradient(circle,#6e8f59,#344c39 70%);overflow:hidden}.road{position:absolute;background:#c6a56a;opacity:.65}.h{left:0;top:48%;width:100%;height:16%}.v{top:0;left:43%;width:14%;height:100%}.tower{position:absolute;width:90px;height:90px;border-radius:50%;background:#d9e1e8;border:8px solid #5d6975;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;font-weight:900;box-shadow:0 6px 12px #0008;user-select:none;touch-action:none}.tower .num{font-size:25px}.blue{border-color:#2f8cff}.red{border-color:#ed4d55}.neutral{border-color:#aeb7bd}.arrow{position:absolute;height:7px;background:#fff;transform-origin:left center;border-radius:8px;pointer-events:none;box-shadow:0 0 7px #fff}.unit{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;pointer-events:none}.blueu{background:#52a4ff}.redu{background:#ff5962}.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#101820dd;padding:10px 16px;border-radius:12px;font-weight:800;z-index:5}.help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#101820dd;padding:10px 14px;border-radius:12px;font-size:13px;z-index:5;text-align:center}</style></head><body><div class="hud"><span>⚔️ TOWER CONQUEST</span><span>🔵 <b id="army">20</b> troops</span><span>🏆 <b id="wins">0</b></span></div><div class="game" id="game"><div class="road h"></div><div class="road v"></div><div class="msg" id="msg">Drag from your tower to an enemy/neutral tower</div><div class="help">Capture every enemy tower • Your towers produce troops</div></div><script>
const game=document.getElementById('game'),msg=document.getElementById('msg'),armyEl=document.getElementById('army'),winsEl=document.getElementById('wins');let towers=[],drag=null,wins=0;
const spots=[[12,25],[43,14],[74,24],[25,65],[60,57],[82,73],[48,82]];
function make(){towers=spots.map((p,i)=>({x:p[0],y:p[1],n:i===0?20:i===6?18:i%2?8:10,owner:i===0?'blue':i===6?'red':'neutral',el:null}));render()}
function render(){game.querySelectorAll('.tower,.arrow,.unit').forEach(e=>e.remove());towers.forEach((t,i)=>{let d=document.createElement('div');d.className='tower '+t.owner;d.style.left='calc('+t.x+'% - 45px)';d.style.top='calc('+t.y+'% - 45px)';d.innerHTML='<div>BASE '+(i+1)+'</div><div class="num">'+t.n+'</div>';d.onpointerdown=e=>startDrag(e,i);d.onpointerup=e=>endDrag(e,i);game.appendChild(d);t.el=d});armyEl.textContent=towers[0].owner==='blue'?towers[0].n:0}
function startDrag(e,i){if(towers[i].owner!=='blue'||towers[i].n<2)return;drag=i;e.currentTarget.setPointerCapture?.(e.pointerId)}
function endDrag(e,j){if(drag===null)return;let i=drag;drag=null;if(i===j)return;if(towers[j].owner==='blue'){return}send(i,j)}
function send(i,j){let from=towers[i],to=towers[j],sent=Math.floor(from.n/2);if(sent<1)return;from.n-=sent;for(let k=0;k<sent;k++){let u=document.createElement('div');u.className='unit blueu';u.style.left=from.x+'%';u.style.top=from.y+'%';game.appendChild(u);let dx=(to.x-from.x),dy=(to.y-from.y),x=0;let timer=setInterval(()=>{x+=.08;u.style.left=(from.x+dx*x)+'%';u.style.top=(from.y+dy*x)+'%';if(x>=1){clearInterval(timer);u.remove()}},35)}setTimeout(()=>{if(to.owner==='neutral'){to.n-=sent;if(to.n<=0){to.owner='blue';to.n=Math.abs(to.n)+2}}else if(to.owner==='red'){to.n-=sent;if(to.n<=0){to.owner='blue';to.n=Math.abs(to.n)+2}}render();checkWin()},500);render()}
function enemyTurn(){let reds=towers.map((t,i)=>t.owner==='red'?i:-1).filter(i=>i>=0);if(!reds.length)return;let r=reds[Math.floor(Math.random()*reds.length)],targets=towers.map((t,i)=>t.owner==='blue'?i:-1).filter(i=>i>=0);if(!targets.length)return;let j=targets[Math.floor(Math.random()*targets.length)],sent=Math.max(1,Math.floor(towers[r].n/2));towers[r].n-=sent;towers[j].n-=sent;if(towers[j].n<0){towers[j].owner='red';towers[j].n=Math.abs(towers[j].n)+1}render();checkWin()}
function checkWin(){let blue=towers.filter(t=>t.owner==='blue').length,red=towers.filter(t=>t.owner==='red').length;if(red===0){wins++;winsEl.textContent=wins;msg.textContent='VICTORY! All towers captured.';setTimeout(make,1400)}}
setInterval(()=>{towers.forEach(t=>{if(t.owner!=='neutral')t.n=Math.min(99,t.n+1)});render()},1800);setInterval(enemyTurn,4200);make();
</script></body></html>
