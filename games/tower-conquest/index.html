<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Tower Conquest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}.app{height:100dvh;display:flex;flex-direction:column;background:#f8df7b}.top{height:22%;min-height:135px;background:linear-gradient(#ffbd57,#ffd77a);position:relative;overflow:hidden;border-bottom:6px solid #35698a}.mine{position:absolute;left:0;right:0;bottom:0;height:52px;background:#f0d99a;border-top:8px solid #274f70;border-bottom:8px solid #274f70}.rail{position:absolute;left:0;right:0;bottom:12px;height:7px;background:#345c72;box-shadow:0 -28px #345c72}.sleepers{position:absolute;left:0;right:0;bottom:0;height:44px;background:repeating-linear-gradient(90deg,transparent 0 24px,#a66d3e 24px 35px,transparent 35px 58px)}.sign{position:absolute;top:18px;left:18px;background:#23475d;border:6px solid #34738c;border-radius:5px;padding:9px 13px;transform:rotate(-7deg);font-weight:1000;font-size:14px}.cart{position:absolute;right:12%;top:22px;width:80px;height:45px;border:8px solid #6b4937;border-top-width:6px;border-radius:8px;transform:rotate(5deg);background:#4c6370}.track{position:absolute;right:3%;top:2px;width:170px;height:85px;border:7px solid #345c72;border-radius:50%;transform:rotate(12deg)}.track:after{content:"";position:absolute;width:65px;height:45px;left:48px;top:18px;background:#526c79;border-radius:8px}.arena{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ffeaa0 0,#f8dc79 62%,#f0c75d 100%);touch-action:none}.hud{position:absolute;z-index:20;top:10px;left:50%;transform:translateX(-50%);background:#ffffffdd;color:#243244;border-radius:20px;padding:7px 13px;font-weight:1000;font-size:13px;box-shadow:0 4px 12px #8b652755}.tower{position:absolute;width:72px;height:88px;transform:translate(-50%,-50%);z-index:8;touch-action:none;user-select:none}.body{position:absolute;left:9px;right:9px;bottom:0;height:64px;border:5px solid #dfe8ef;border-radius:14px 14px 18px 18px;background:linear-gradient(#fff,#d4dce3);box-shadow:0 7px 9px #765b2670}.body:before{content:"";position:absolute;left:12px;right:12px;top:18px;height:25px;background:#2e3d47;border-radius:4px}.cap{position:absolute;left:0;right:0;top:0;height:48px;border-radius:15px 15px 10px 10px;border:5px solid #fff;background:linear-gradient(#44adff,#1879d4);box-shadow:0 5px 7px #765b2655;z-index:2}.red .cap{background:linear-gradient(#ff6767,#dc2d36)}.green .cap{background:linear-gradient(#48d968,#10aa4b)}.cap .num{font-size:17px;font-weight:1000;text-align:center;padding-top:4px}.dots{display:flex;gap:5px;justify-content:center}.dots i{width:7px;height:7px;background:#fff8;border-radius:50%}.range{position:absolute;width:150px;height:150px;border:2px solid #fff8;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1}.path{position:absolute;height:7px;border-radius:8px;transform-origin:left center;z-index:2;opacity:.8;pointer-events:none}.bluepath{background:#35a7e8;box-shadow:0 1px 2px #fff8}.redpath{background:#f35b62}.crate{position:absolute;width:38px;height:28px;background:linear-gradient(135deg,#9c5d30,#c17b43);border:3px solid #704326;transform:rotate(42deg);z-index:5;box-shadow:0 4px 4px #76522b55}.crate:after{content:"";position:absolute;inset:5px;border:2px solid #744426}.bottom{height:18%;min-height:105px;background:#7428c7;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;z-index:30;border-top:6px solid #4c168e}.bottom b{font-size:clamp(28px,7vw,52px);line-height:.9;color:#ffd92f;text-shadow:3px 4px #1b1230,-1px -1px #fff;font-weight:1000}.bottom small{display:block;color:#fff;font-size:15px;font-weight:1000;margin-top:8px;text-shadow:1px 2px #28103f}.dragline{position:absolute;height:9px;background:#38a8ff;border-radius:10px;transform-origin:left center;z-index:15;pointer-events:none}.win{position:absolute;z-index:50;inset:0;display:none;align-items:center;justify-content:center;background:#0008}.win div{background:#7528c8;border:5px solid #ffd22f;border-radius:22px;padding:25px 35px;text-align:center;font-weight:1000}.win button{margin-top:14px;border:0;border-radius:12px;padding:12px 25px;background:#ffd22f;font-weight:1000}
</style></head><body><div class="app"><header class="top"><div class="sign">ULTIMATE CRISIS</div><div class="track"></div><div class="cart"></div><div class="mine"><div class="rail"></div><div class="sleepers"></div></div></header><main class="arena" id="arena"><div class="hud">🔵 <span id="army">20</span> TROOPS &nbsp; • &nbsp; 🏆 <span id="wins">0</span></div><div class="win" id="win"><div><div style="font-size:34px;color:#ffd52e">VICTORY!</div><div>THE ENEMY IS DEFEATED</div><button id="again">PLAY AGAIN</button></div></div></main><footer class="bottom"><div><b>OUTWIT<br>THE ENEMY</b><small>Drag troops between towers</small></div></footer></div><script>
const arena=document.getElementById('arena'),armyEl=document.getElementById('army'),winsEl=document.getElementById('wins'),win=document.getElementById('win');let towers=[],drag=null,wins=0;
const spots=[[17,24],[50,17],[83,25],[27,57],[69,57],[50,84]],crates=[[48,47],[54,45],[42,52],[51,55],[59,50],[36,48]];
function reset(){towers=spots.map((p,i)=>({x:p[0],y:p[1],n:i===5?23:i===0?12:i===2?12:i===3?0:i===4?0:2,owner:i===5?'blue':(i===0?'green':i===2?'red':'neutral')}));win.style.display='none';render()}
function line(x1,y1,x2,y2,cls){let d=document.createElement('div');let dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);d.className='path '+cls;d.style.left=x1+'%';d.style.top=y1+'%';d.style.width=len+'%';d.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';arena.appendChild(d)}
function render(){arena.querySelectorAll('.tower,.range,.path,.crate,.unit').forEach(e=>e.remove());crates.forEach(p=>{let c=document.createElement('div');c.className='crate';c.style.left=p[0]+'%';c.style.top=p[1]+'%';arena.appendChild(c)});for(let i=0;i<towers.length;i++)for(let j=i+1;j<towers.length;j++)if(towers[i].owner!=='neutral'&&towers[j].owner!=='neutral')line(towers[i].x,towers[i].y,towers[j].x,towers[j].y,towers[i].owner==='red'?'redpath':'bluepath');towers.forEach((t,i)=>{let r=document.createElement('div');r.className='range';r.style.left=t.x+'%';r.style.top=t.y+'%';arena.appendChild(r);let d=document.createElement('div');d.className='tower '+t.owner;d.style.left=t.x+'%';d.style.top=t.y+'%';d.innerHTML='<div class="cap"><div class="num">'+t.n+'</div><div class="dots"><i></i><i></i></div></div><div class="body"></div>';d.onpointerdown=e=>start(e,i);d.onpointerup=e=>end(e,i);arena.appendChild(d)});armyEl.textContent=towers.find(t=>t.owner==='blue')?.n||0}
function start(e,i){if(towers[i].owner!=='blue'||towers[i].n<2)return;drag=i;arena.setPointerCapture?.(e.pointerId);drawDrag(e)}
function drawDrag(e){if(drag===null)return;let r=arena.getBoundingClientRect(),sx=towers[drag].x/100*r.width,sy=towers[drag].y/100*r.height,ex=e.clientX-r.left,ey=e.clientY-r.top,dx=ex-sx,dy=ey-sy,d=document.getElementById('dragline')||document.createElement('div');d.id='dragline';d.className='dragline';d.style.left=sx+'px';d.style.top=sy+'px';d.style.width=Math.hypot(dx,dy)+'px';d.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';arena.appendChild(d)}
arena.onpointermove=drawDrag;arena.onpointerup=e=>{if(drag===null)return;let r=arena.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,best=-1,dist=99;towers.forEach((t,i)=>{let q=Math.hypot(t.x-x,t.y-y);if(i!==drag&&q<dist){dist=q;best=i}});document.getElementById('dragline')?.remove();let from=drag;drag=null;if(best>=0&&dist<13&&towers[best].owner!=='blue')attack(from,best)};
function attack(i,j){let from=towers[i],to=towers[j],sent=Math.floor(from.n/2);if(sent<1)return;from.n-=sent;to.n-=sent;if(to.n<0){to.owner='blue';to.n=Math.abs(to.n)+1}render();if(towers.filter(t=>t.owner==='red').length===0){wins++;winsEl.textContent=wins;win.style.display='flex'}}
setInterval(()=>{towers.forEach(t=>{if(t.owner!=='neutral')t.n=Math.min(99,t.n+1)});render()},1800);
setInterval(()=>{let reds=towers.map((t,i)=>t.owner==='red'?i:-1).filter(i=>i>=0),bs=towers.map((t,i)=>t.owner==='blue'?i:-1).filter(i=>i>=0);if(!reds.length||!bs.length)return;let r=reds[Math.floor(Math.random()*reds.length)],b=bs[Math.floor(Math.random()*bs.length)],sent=Math.max(1,Math.floor(towers[r].n/2));towers[r].n-=sent;towers[b].n-=sent;if(towers[b].n<0){towers[b].owner='red';towers[b].n=Math.abs(towers[b].n)+1}render()},4200);
document.getElementById('again').onclick=reset;reset();
</script></body></html>
