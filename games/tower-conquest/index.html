<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Tower Conquest</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}.app{height:100dvh;display:flex;flex-direction:column;background:#f8df7b}.top{height:20%;min-height:120px;background:linear-gradient(#ffbd57,#ffd77a);position:relative;overflow:hidden;border-bottom:6px solid #35698a}.mine{position:absolute;left:0;right:0;bottom:0;height:48px;background:#f0d99a;border-top:8px solid #274f70;border-bottom:8px solid #274f70}.rail{position:absolute;left:0;right:0;bottom:12px;height:7px;background:#345c72;box-shadow:0 -25px #345c72}.sleepers{position:absolute;left:0;right:0;bottom:0;height:40px;background:repeating-linear-gradient(90deg,transparent 0 24px,#a66d3e 24px 35px,transparent 35px 58px)}.sign{position:absolute;top:15px;left:18px;background:#23475d;border:5px solid #34738c;padding:8px 12px;transform:rotate(-7deg);font-weight:1000}.cart{position:absolute;right:15%;top:18px;width:75px;height:42px;border:7px solid #6b4937;border-radius:8px;background:#4c6370;transform:rotate(5deg)}.track{position:absolute;right:3%;top:0;width:165px;height:78px;border:7px solid #345c72;border-radius:50%;transform:rotate(12deg)}.arena{position:relative;flex:1;overflow:hidden;background:radial-gradient(circle at 50% 45%,#ffeaa0,#f8dc79 62%,#f0c75d);touch-action:none}.hud{position:absolute;z-index:30;top:9px;left:50%;transform:translateX(-50%);background:#ffffffe8;color:#243244;border-radius:20px;padding:8px 13px;font-weight:1000;font-size:13px;white-space:nowrap;box-shadow:0 4px 12px #8b652755}.tower{position:absolute;width:74px;height:90px;transform:translate(-50%,-50%);z-index:10;touch-action:none;user-select:none}.body{position:absolute;left:9px;right:9px;bottom:0;height:64px;border:5px solid #dfe8ef;border-radius:14px 14px 18px 18px;background:linear-gradient(#fff,#d4dce3);box-shadow:0 7px 9px #765b2670}.body:before{content:"";position:absolute;left:12px;right:12px;top:18px;height:25px;background:#2e3d47;border-radius:4px}.cap{position:absolute;left:0;right:0;top:0;height:49px;border-radius:15px 15px 10px 10px;border:5px solid #fff;background:linear-gradient(#44adff,#1879d4);box-shadow:0 5px 7px #765b2655;z-index:2}.red .cap{background:linear-gradient(#ff6767,#dc2d36)}.gray .cap{background:linear-gradient(#aeb7be,#727d84)}.cap .num{font-size:18px;font-weight:1000;text-align:center;padding-top:4px}.dots{display:flex;gap:5px;justify-content:center}.dots i{width:7px;height:7px;background:#fff8;border-radius:50%}.range{position:absolute;width:150px;height:150px;border:2px solid #fff7;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1}.path{position:absolute;height:8px;border-radius:8px;transform-origin:left center;z-index:5;pointer-events:auto;opacity:.9}.bluepath{background:#2196e8;box-shadow:0 0 5px #fff}.redpath{background:#ef4d57;box-shadow:0 0 5px #fff}.unit{position:absolute;width:9px;height:9px;border-radius:50%;z-index:7;pointer-events:none}.blueu{background:#1b9cff}.redu{background:#ff3e4b}.crate{position:absolute;width:38px;height:28px;background:linear-gradient(135deg,#9c5d30,#c17b43);border:3px solid #704326;transform:rotate(42deg);z-index:4}.crate:after{content:"";position:absolute;inset:5px;border:2px solid #744426}.dragline{position:absolute;height:9px;background:#fff;border-radius:10px;transform-origin:left center;z-index:25;pointer-events:none;box-shadow:0 0 8px #2196e8}.bottom{height:17%;min-height:98px;background:#7428c7;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;z-index:30;border-top:6px solid #4c168e}.bottom b{font-size:clamp(27px,7vw,50px);line-height:.9;color:#ffd92f;text-shadow:3px 4px #1b1230,-1px -1px #fff;font-weight:1000}.bottom small{display:block;color:#fff;font-size:14px;font-weight:1000;margin-top:7px}.win{position:absolute;z-index:60;inset:0;display:none;align-items:center;justify-content:center;background:#0008}.win div{background:#7528c8;border:5px solid #ffd22f;border-radius:22px;padding:25px 35px;text-align:center;font-weight:1000}.win button{margin-top:14px;border:0;border-radius:12px;padding:12px 25px;background:#ffd22f;font-weight:1000}</style></head><body><div class="app"><header class="top"><div class="sign">ULTIMATE CRISIS</div><div class="track"></div><div class="cart"></div><div class="mine"><div class="rail"></div><div class="sleepers"></div></div></header><main class="arena" id="arena"><div class="hud">🔵 <span id="army">100</span> TROOPS &nbsp; • &nbsp; 🔗 <span id="links">0</span>/3 LINES</div><div class="win" id="win"><div><div style="font-size:34px;color:#ffd52e">VICTORY!</div><div>THE ENEMY TOWER IS CAPTURED</div><button id="again">PLAY AGAIN</button></div></div></main><footer class="bottom"><div><b>OUTWIT<br>THE ENEMY</b><small>Drag your tower → gray or enemy tower</small></div></footer></div><script>
const arena=document.getElementById('arena'),armyEl=document.getElementById('army'),linksEl=document.getElementById('links'),win=document.getElementById('win');let towers=[],links=[],drag=null,wins=0;
const spots=[[18,28],[50,18],[82,28],[28,58],[72,58],[50,84]],crates=[[48,45],[55,43],[43,50],[51,53],[59,48],[37,47]];
function reset(){links=[];towers=spots.map((p,i)=>({x:p[0],y:p[1],n:i===5?100:i===2?100:25,owner:i===5?'blue':i===0?'gray':i===2?'red':'gray',max:i===5?100:i===2?100:25}));/* ensure exactly one red, one blue, rest gray */towers[0].n=24;towers[1].n=27;towers[3].n=21;towers[4].n=29;towers[2].n=100;win.style.display='none';render()}
function line(l){let a=towers[l.from],b=towers[l.to],d=document.createElement('div'),dx=b.x-a.x,dy=b.y-a.y;d.className='path '+(l.owner==='blue'?'bluepath':'redpath');d.style.left=a.x+'%';d.style.top=a.y+'%';d.style.width=Math.hypot(dx,dy)+'%';d.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';d.title='Tap to cancel';d.onclick=()=>{links=links.filter(x=>x!==l);render()};arena.appendChild(d)}
function render(){arena.querySelectorAll('.tower,.range,.path,.crate,.unit').forEach(e=>e.remove());crates.forEach(p=>{let c=document.createElement('div');c.className='crate';c.style.left=p[0]+'%';c.style.top=p[1]+'%';arena.appendChild(c)});links.forEach(line);towers.forEach((t,i)=>{let r=document.createElement('div');r.className='range';r.style.left=t.x+'%';r.style.top=t.y+'%';arena.appendChild(r);let d=document.createElement('div');d.className='tower '+(t.owner==='blue'?'blue':t.owner==='red'?'red':'gray');d.style.left=t.x+'%';d.style.top=t.y+'%';d.innerHTML='<div class="cap"><div class="num">'+t.n+'</div><div class="dots"><i></i><i></i></div></div><div class="body"></div>';d.onpointerdown=e=>start(e,i);d.onpointerup=e=>end(e,i);arena.appendChild(d)});let bt=towers.find(t=>t.owner==='blue');armyEl.textContent=bt?bt.n:0;linksEl.textContent=links.filter(l=>l.owner==='blue').length}
function start(e,i){if(towers[i].owner!=='blue'||towers[i].n<1)return;if(links.filter(l=>l.owner==='blue').length>=3)return;drag=i;arena.setPointerCapture?.(e.pointerId);drawDrag(e)}
function drawDrag(e){if(drag===null)return;let r=arena.getBoundingClientRect(),sx=towers[drag].x/100*r.width,sy=towers[drag].y/100*r.height,ex=e.clientX-r.left,ey=e.clientY-r.top,dx=ex-sx,dy=ey-sy,d=document.getElementById('dragline')||document.createElement('div');d.id='dragline';d.className='dragline';d.style.left=sx+'px';d.style.top=sy+'px';d.style.width=Math.hypot(dx,dy)+'px';d.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';arena.appendChild(d)}
arena.onpointermove=drawDrag;arena.onpointerup=e=>{if(drag===null)return;let r=arena.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,best=-1,dist=99;towers.forEach((t,i)=>{let q=Math.hypot(t.x-x,t.y-y);if(i!==drag&&q<dist){dist=q;best=i}});document.getElementById('dragline')?.remove();let from=drag;drag=null;if(best<0||dist>14||towers[best].owner==='blue')return;let exists=links.some(l=>l.owner==='blue'&&l.from===from&&l.to===best);if(exists)return;if(links.filter(l=>l.owner==='blue').length>=3)return;links.push({from,to:best,owner:'blue'});render()}
function moveTroop(l){let from=towers[l.from],to=towers[l.to];if(!from||from.owner!==l.owner||from.n<=0)return;from.n--;to.n--;spawnUnit(l,from,to);if(to.owner==='gray'&&to.n<=0){to.owner=l.owner;to.n=Math.max(0,Math.abs(to.n))}else if(to.owner!==l.owner&&to.owner!=='gray'&&to.n<=0){to.owner=l.owner;to.n=Math.max(0,Math.abs(to.n));if(l.owner==='blue'&&to.owner==='blue'){}if(to.owner==='blue'&&towers.some(t=>t.owner==='red')===false)win.style.display='flex'}render()}
function spawnUnit(l,a,b){let u=document.createElement('div');u.className='unit '+(l.owner==='blue'?'blueu':'redu');u.style.left=a.x+'%';u.style.top=a.y+'%';arena.appendChild(u);let x=0,dx=b.x-a.x,dy=b.y-a.y,t=setInterval(()=>{x+=.16;u.style.left=(a.x+dx*x)+'%';u.style.top=(a.y+dy*x)+'%';if(x>=1){clearInterval(t);u.remove()}},35)}
setInterval(()=>{links.slice().forEach(l=>moveTroop(l))},300);
setInterval(()=>{towers.forEach(t=>{if(t.owner==='blue'||t.owner==='red')t.n=Math.min(100,t.n+1)});render()},2000);
setInterval(()=>{let reds=towers.map((t,i)=>t.owner==='red'?i:-1).filter(i=>i>=0);if(!reds.length)return;let r=reds[Math.floor(Math.random()*reds.length)],targets=towers.map((t,i)=>t.owner==='red'||t.owner==='gray'?-1:i).filter(i=>i>=0);let bs=towers.map((t,i)=>t.owner==='blue'?i:-1).filter(i=>i>=0);if(!bs.length)return;let target=bs[Math.floor(Math.random()*bs.length)];if(links.filter(l=>l.owner==='red').length<3&&!links.some(l=>l.owner==='red'&&l.from===r&&l.to===target)){links.push({from:r,to:target,owner:'red'});render()}},2200);
document.getElementById('again').onclick=reset;reset();
</script></body></html>
