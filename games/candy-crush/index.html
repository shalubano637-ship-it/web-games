<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Candy Crush</title><style>
*{box-sizing:border-box}body{margin:0;background:#160b27;color:#fff;font-family:Arial;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}.app{width:min(100%,520px);height:100vh;max-height:900px;background:linear-gradient(#34125b,#180b2d);padding:14px;display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:26px;font-weight:900;text-shadow:0 3px #7b2ca8}.stat{background:#24103d;border:2px solid #8d4dcc;border-radius:14px;padding:8px 12px;font-weight:800}#board{width:min(92vw,480px);aspect-ratio:1;border:5px solid #8e50c7;border-radius:20px;background:#291143;box-shadow:0 8px 25px #0008;padding:6px;display:grid;gap:5px;touch-action:none;align-self:center}.cell{border-radius:14px;position:relative;box-shadow:inset 0 2px 2px #fff8,inset 0 -5px 7px #0005,0 2px 3px #0008;transition:transform .12s,opacity .15s}.cell:after{content:"";position:absolute;inset:16% 20%;border-radius:50%;background:#fff7}.c0{background:#ff4d6d}.c1{background:#ffc43d}.c2{background:#36d66b}.c3{background:#36a9ff}.c4{background:#a55cff}.c5{background:#ff7ac8}.selected{outline:4px solid #fff;transform:scale(.88)}.pop{animation:pop .18s forwards}@keyframes pop{to{transform:scale(.1);opacity:0}}.controls{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:14px;padding:13px;background:#ffca3a;color:#351046;font-weight:900;font-size:16px;box-shadow:0 4px 0 #b77b13}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b77b13}.msg{text-align:center;font-weight:800;min-height:24px}</style></head><body><main class="app"><div class="top"><div class="title">🍬 Candy Crush</div><div class="stat">⭐ <span id="score">0</span></div></div><div class="stat" style="display:flex;justify-content:space-between"><span>Level <b id="level">1</b></span><span>Moves <b id="moves">30</b></span></div><div id="board"></div><div class="msg" id="msg">Match 3 or more candies!</div><div class="controls"><button class="btn" id="shuffle">SHUFFLE</button><button class="btn" id="restart">RESTART</button></div></main><script>
const N=8,C=6;let a=[],sel=null,score=0,moves=30,level=1,busy=false;const board=document.getElementById('board');function rnd(){return Math.floor(Math.random()*C)}function refill(){do{a=Array.from({length:N},()=>Array.from({length:N},rnd))}while(findMatches().length)}function findMatches(){let s=new Set();for(let r=0;r<N;r++){let st=0;for(let c=1;c<=N;c++){if(c<N&&a[r][c]===a[r][st])continue;if(c-st>=3)for(let k=st;k<c;k++)s.add(r*N+k);st=c}}for(let c=0;c<N;c++){let st=0;for(let r=1;r<=N;r++){if(r<N&&a[r][c]===a[st][c])continue;if(r-st>=3)for(let k=st;k<r;k++)s.add(k*N+c);st=r}}return [...s]}function render(){board.style.gridTemplateColumns='repeat('+N+',1fr)';board.innerHTML='';a.forEach((row,r)=>row.forEach((v,c)=>{let d=document.createElement('div');d.className='cell c'+v+(sel&&sel.r===r&&sel.c===c?' selected':'');d.onpointerdown=()=>pick(r,c);board.appendChild(d)}));scoreEl.textContent=score;movesEl.textContent=moves;levelEl.textContent=level}const scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves'),levelEl=document.getElementById('level');function pick(r,c){if(busy||moves<=0)return;if(!sel){sel={r,c};render();return}let dr=Math.abs(sel.r-r),dc=Math.abs(sel.c-c);if(dr+dc!==1){sel={r,c};render();return}let p=sel;sel=null;[a[p.r][p.c],a[r][c]]=[a[r][c],a[p.r][p.c]];if(findMatches().length){moves--;busy=true;render();setTimeout(cascade,150)}else{[a[p.r][p.c],a[r][c]]=[a[r][c],a[p.r][p.c]];msg.textContent='Try a move that makes a match.';render()}}function cascade(){let m=findMatches();if(!m.length){busy=false;check();return}score+=m.length*10+(m.length>=4?20:0);let set=new Set(m);m.forEach(i=>{let d=board.children[i];if(d)d.classList.add('pop')});setTimeout(()=>{for(let c=0;c<N;c++){let col=[];for(let r=N-1;r>=0;r--)if(!set.has(r*N+c))col.push(a[r][c]);for(let r=N-1,k=0;r>=0;r--,k++)a[r][c]=k<col.length?col[k]:rnd()}render();setTimeout(cascade,90)},170)}function check(){msg.textContent=moves?'Make your next match!':'Out of moves — restart to play again.';if(score>=level*500){level++;moves+=10;msg.textContent='Level up! +10 moves'}}function start(){score=0;moves=30;level=1;sel=null;refill();msg.textContent='Match 3 or more candies!';render()}document.getElementById('shuffle').onclick=()=>{if(!busy){refill();sel=null;render();msg.textContent='Board shuffled.'}};document.getElementById('restart').onclick=()=>{if(!busy)start()};start();
</script></body></html>
